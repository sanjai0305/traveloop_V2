events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:5000;
    }

    upstream ai-service {
        server ai-service:8000;
    }

    upstream user-website {
        server user-website:80;
    }

    upstream admin-portal {
        server admin-portal:80;
    }

    upstream agent-portal {
        server agent-portal:80;
    }

    upstream driver-portal {
        server driver-portal:80;
    }

    # ── Traveler Website ───────────────────────────
    server {
        listen 80;
        server_name localhost app.traveloop.in;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }

        # WebSocket support for Socket.io
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://user-website;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── Admin Portal ───────────────────────────────
    server {
        listen 3001;
        server_name localhost admin.traveloop.in;

        location / {
            proxy_pass http://admin-portal;
            proxy_set_header Host $host;
        }
    }

    # ── Agent Portal ───────────────────────────────
    server {
        listen 3002;
        server_name localhost agent.traveloop.in;

        location / {
            proxy_pass http://agent-portal;
            proxy_set_header Host $host;
        }
    }

    # ── Driver Portal ──────────────────────────────
    server {
        listen 3003;
        server_name localhost driver.traveloop.in;

        location / {
            proxy_pass http://driver-portal;
            proxy_set_header Host $host;
        }
    }

    # ── AI Service ─────────────────────────────────
    server {
        listen 8000;
        server_name localhost ai.traveloop.in;

        location / {
            proxy_pass http://ai-service;
            proxy_set_header Host $host;
        }
    }
}
