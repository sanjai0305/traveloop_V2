# =======================================================
#  Traveloop V2 — Docker Compose  (Production)
#  Usage:  docker compose up --build
# =======================================================

version: "3.9"

# ── Shared network ─────────────────────────────────────
networks:
  traveloop-net:
    driver: bridge

# ── Persistent volumes ────────────────────────────────
volumes:
  mysql-data:
  redis-data:
  qdrant-data:

# ── Services ──────────────────────────────────────────
services:

  # ────────────────────────────────────────────────────
  #  MySQL 8.0 (Primary Relational Database)
  # ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: traveloop-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-traveloop_root_password}
      MYSQL_DATABASE: ${DB_NAME:-traveloop}
      MYSQL_USER: ${DB_USER:-traveloop_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-traveloop_secure_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Backend/sql/mysql_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────
  #  Redis  (AI memory + seat reservation cache)
  # ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: traveloop-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────
  #  Qdrant  (Vector DB for AI search)
  # ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: traveloop-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────
  #  Backend  (Node.js / Express API)
  # ────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: traveloop-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: traveloop
      DB_USER: traveloop_app
      DB_PASSWORD: ${DB_PASSWORD:-traveloop_secure_password}
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    volumes:
      - ./Backend/logs:/app/logs

  # ────────────────────────────────────────────────────
  #  AI Service  (FastAPI / Python)
  # ────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: traveloop-ai
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: traveloop
      DB_USER: traveloop_app
      DB_PASSWORD: ${DB_PASSWORD:-traveloop_secure_password}
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ────────────────────────────────────────────────────
  #  User Website  (Traveler Platform)
  # ────────────────────────────────────────────────────
  user-website:
    build:
      context: ./user-website
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: traveloop-user-website
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────
  #  Admin Portal
  # ────────────────────────────────────────────────────
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: traveloop-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────
  #  Agent Portal
  # ────────────────────────────────────────────────────
  agent-portal:
    build:
      context: ./agent-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: traveloop-agent
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────
  #  Driver Portal
  # ────────────────────────────────────────────────────
  driver-portal:
    build:
      context: ./driver-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: traveloop-driver
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traveloop-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────
  #  Nginx Reverse Proxy  (optional, routes by subdomain/port)
  # ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: traveloop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - user-website
      - admin-portal
      - agent-portal
      - driver-portal
    networks:
      - traveloop-net
    profiles:
      - proxy
