name: Deploy Traveloop Backend to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================"
            echo "Starting Traveloop Backend Deployment"
            echo "================================"

            # Go to repository
            cd ~/traveloop_V2

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            # Go ONLY to backend
            cd Backend

            echo "Current directory:"
            pwd

            echo "Installing backend dependencies..."
            npm ci --omit=dev

            echo "Restarting backend..."

            if pm2 describe traveloop-backend > /dev/null 2>&1; then
              pm2 restart traveloop-backend --update-env
            else
              pm2 start server.js --name traveloop-backend
            fi

            echo "Saving PM2 configuration..."
            pm2 save

            echo "Backend status:"
            pm2 status

            echo "================================"
            echo "Backend Deployment Successful"
            echo "================================"
