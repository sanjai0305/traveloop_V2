name: Deploy Traveloop V2 to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================"
            echo "Starting Traveloop V2 deployment"
            echo "================================"

            # Go to project root
            cd ~/traveloop_V2

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Current project directory:"
            pwd

            echo "Project files:"
            ls -la

            echo "Installing backend dependencies..."

            # Backend is in project root
            npm ci --omit=dev

            echo "Restarting backend..."

            if pm2 describe traveloop-backend > /dev/null 2>&1; then
              pm2 restart traveloop-backend --update-env
            else
              pm2 start server.js --name traveloop-backend
            fi

            echo "Saving PM2 process list..."
            pm2 save

            echo "Checking backend status..."
            pm2 status

            echo "================================"
            echo "Deployment completed successfully"
            echo "================================"