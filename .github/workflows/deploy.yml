name: Deploy Traveloop Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================"
            echo "Starting Traveloop Backend Deployment"
            echo "================================"

            # ---------------------------------
            # 1. Go to project repository
            # ---------------------------------
            cd ~/traveloop_V2

            echo "Pulling latest code..."

            git fetch origin
            git reset --hard origin/main

            # ---------------------------------
            # 2. Go to Backend only
            # ---------------------------------
            cd Backend

            echo "Backend directory:"
            pwd

            # ---------------------------------
            # 3. Clean previous dependencies
            # ---------------------------------
            echo "Cleaning old node_modules..."

            rm -rf node_modules

            # ---------------------------------
            # 4. Install production dependencies
            # ---------------------------------
            echo "Installing backend dependencies..."

            npm ci --omit=dev

            # ---------------------------------
            # 5. Restart backend using PM2
            # ---------------------------------
            echo "Restarting Traveloop Backend..."

            if pm2 describe traveloop-backend > /dev/null 2>&1; then

              echo "Existing PM2 process found."
              pm2 restart traveloop-backend --update-env

            else

              echo "Starting backend for first time."
              pm2 start server.js --name traveloop-backend

            fi

            # ---------------------------------
            # 6. Save PM2 process
            # ---------------------------------
            echo "Saving PM2 configuration..."

            pm2 save

            # ---------------------------------
            # 7. Show deployment status
            # ---------------------------------
            echo "Backend status:"

            pm2 status

            echo "================================"
            echo "Traveloop Backend Deployment Successful"
            echo "================================"
