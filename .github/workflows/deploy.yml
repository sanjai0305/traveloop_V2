name: Deploy Traveloop V2 to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================"
            echo "Starting Traveloop deployment"
            echo "================================"

            cd ~/traveloop_V2

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing backend dependencies..."
            cd backend
            npm ci --omit=dev

            echo "Restarting backend..."
            pm2 restart traveloop-backend || pm2 start server.js --name traveloop-backend

            echo "Saving PM2..."
            pm2 save

            echo "================================"
            echo "Deployment completed successfully"
            echo "================================"
